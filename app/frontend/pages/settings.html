---
title: Settings · Magic-data
styles:
  - /assets/css/markdown.css
  - /assets/css/settings.css
scripts:
  - /assets/js/settings.js
---
    <main class="static-page">
        <article class="markdown-content">
            <h1>Settings</h1>
            <h2>LLM connection</h2>
            <div class="settings-magic">
                <button type="button" class="magic-btn" data-provider="codex"><svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#sparkles"></use></svg> Check Codex</button>
                <button type="button" class="magic-btn" data-provider="claude"><svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#sparkles"></use></svg> Check Claude</button>
            </div>
            <h2>Preferences</h2>
            <div class="settings-list">
                <label class="settings-item">
                    <span>Default view</span>
                    <select class="settings-select" data-default-view></select>
                </label>
                <label class="settings-item">
                    <span>Number format</span>
                    <select class="settings-select" data-number-format></select>
                </label>
            </div>
        </article>
    </main>
