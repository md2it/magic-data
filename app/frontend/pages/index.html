---
title: Magic-data
styles:
  - /assets/css/index.css
scripts:
  - /assets/js/content-view.js
  - /assets/js/index.js
---
    <div class="app-body">
        <aside class="app-body__sidebar">
            <div class="sidebar-toolbar">
                <button type="button" class="sidebar-toolbar__button" id="new-file">+ File</button>
                <button type="button" class="sidebar-toolbar__button" id="new-folder">+ Folder</button>
            </div>
            <ul id="file-tree" class="tree-list tree-list--root"></ul>
        </aside>
        <main class="app-body__content">
            <div class="content-toolbar">
                <div class="view-switch" id="view-switch" role="radiogroup" aria-label="View">
                    <button type="button" class="view-switch__option active" data-view="json" role="radio" aria-checked="true">JSON</button>
                    <button type="button" class="view-switch__option" data-view="tree" role="radio" aria-checked="false">Tree</button>
                    <button type="button" class="view-switch__option" data-view="table" role="radio" aria-checked="false">Table</button>
                    <button type="button" class="view-switch__option" data-view="text" role="radio" aria-checked="false">Text</button>
                </div>
                <div class="content-toolbar__actions" id="content-toolbar-actions">
                    <div class="content-toolbar__group" id="collapse-expand-group">
                        <button type="button" class="content-toolbar__button" id="collapse-all">Collapse all</button>
                        <button type="button" class="content-toolbar__button" id="expand-all">Expand all</button>
                    </div>
                    <div class="content-toolbar__download">
                        <button type="button" class="content-toolbar__button" id="download-button" aria-haspopup="true" aria-expanded="false">Download ▾</button>
                        <div class="content-toolbar__dropdown" id="download-dropdown" role="menu" hidden>
                            <button type="button" class="content-toolbar__dropdown-item" data-format="json" role="menuitem">JSON</button>
                            <button type="button" class="content-toolbar__dropdown-item" data-format="csv" role="menuitem">CSV</button>
                            <button type="button" class="content-toolbar__dropdown-item" data-format="tsv" role="menuitem">TSV</button>
                            <button type="button" class="content-toolbar__dropdown-item" data-format="pdf-text" role="menuitem">PDF Text</button>
                            <button type="button" class="content-toolbar__dropdown-item" data-format="pdf-table" role="menuitem">PDF Table</button>
                        </div>
                    </div>
                </div>
            </div>
            <pre id="file-content" class="file-content"></pre>
            <div id="print-footer" class="print-footer"></div>
        </main>
    </div>
