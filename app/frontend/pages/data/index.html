---
title: Magic-data
styles:
  - /assets/css/index.css
scripts:
  - /assets/js/content-view.js
  - /assets/js/content-table-hover.js
  - /assets/js/index.js
---
    <div class="app-body">
        <aside class="app-body__sidebar" id="app-sidebar">
            <div class="sidebar-toolbar">
                <button type="button" class="sidebar-toolbar__button sidebar-toolbar__button--icon" id="new-file" aria-label="New file manually" data-tooltip="New file manually"><svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#file-plus"></use></svg><svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#pointer"></use></svg></button>
                <button type="button" class="sidebar-toolbar__button sidebar-toolbar__button--icon" id="new-folder" aria-label="New folder manually" data-tooltip="New folder manually"><svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#folder-plus"></use></svg><svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#pointer"></use></svg></button>
            </div>
            <ul id="file-tree" class="tree-list tree-list--root"></ul>
            <button type="button" class="sidebar-toolbar__button sidebar-toolbar__button--icon sidebar-collapse" id="sidebar-collapse" aria-expanded="true" aria-controls="app-sidebar" aria-label="Collapse sidebar" data-tooltip="Collapse sidebar"><svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#chevron-left"></use></svg></button>
        </aside>
        <main class="app-body__content">
            <div class="content-toolbar">
                <div class="view-switch" id="view-switch" role="radiogroup" aria-label="View">
                    <button type="button" class="view-switch__option" data-view="json" role="radio" aria-checked="false">JSON</button>
                    <button type="button" class="view-switch__option" data-view="tree" role="radio" aria-checked="false">Tree</button>
                    <button type="button" class="view-switch__option active" data-view="table" role="radio" aria-checked="true">Table</button>
                    <button type="button" class="view-switch__option" data-view="text" role="radio" aria-checked="false">Text</button>
                </div>
                <div class="content-toolbar__actions" id="content-toolbar-actions">
                    <div class="content-toolbar__group" id="collapse-expand-group">
                        <button type="button" class="content-toolbar__button content-toolbar__button--icon" id="collapse-all" aria-label="Collapse all" data-tooltip="Collapse all"><svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#chevrons-down-up"></use></svg></button>
                        <button type="button" class="content-toolbar__button content-toolbar__button--icon" id="expand-all" aria-label="Expand all" data-tooltip="Expand all"><svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#chevrons-up-down"></use></svg></button>
                    </div>
                    <div class="content-toolbar__menu">
                        <button type="button" class="content-toolbar__button content-toolbar__button--menu" id="download-button" aria-haspopup="true" aria-expanded="false" aria-label="Download" data-tooltip="Download"><svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#file-down"></use></svg><svg class="icon icon--sm content-toolbar__caret" aria-hidden="true"><use href="/assets/images/icons.svg#chevron-down"></use></svg></button>
                        <div class="content-toolbar__dropdown" id="download-dropdown" role="menu" hidden>
                            <p class="content-toolbar__dropdown-header">Download</p>
                            <button type="button" class="content-toolbar__dropdown-item" data-format="json" role="menuitem">JSON</button>
                            <button type="button" class="content-toolbar__dropdown-item" data-format="csv" role="menuitem">CSV</button>
                            <button type="button" class="content-toolbar__dropdown-item" data-format="tsv" role="menuitem">TSV</button>
                            <button type="button" class="content-toolbar__dropdown-item" data-format="pdf-text" role="menuitem">PDF Text</button>
                            <button type="button" class="content-toolbar__dropdown-item" data-format="pdf-table" role="menuitem">PDF Table</button>
                        </div>
                    </div>
                </div>
            </div>
            <table class="print-doc">
                <tbody>
                    <tr><td><pre id="file-content" class="file-content"></pre></td></tr>
                </tbody>
                <tfoot>
                    <tr><td><div id="print-footer" class="print-footer"></div></td></tr>
                </tfoot>
            </table>
        </main>
    </div>
