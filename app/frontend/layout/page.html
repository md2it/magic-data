<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/icons.css">
    <link rel="stylesheet" href="/assets/css/tooltip.css">
{{ page_head }}
</head>
<body>
{{ initial_state }}
    <header class="app-header" id="app-header">
        <a class="app-header__title" href="/">Magic-data</a>
        <nav class="app-header__nav" aria-label="Main navigation">
            <a href="/data">Data</a>
            <a class="app-header__magic-log" href="/magic-log">Magic log <span class="app-header__magic-counts" aria-label="Current Magic runs"></span></a>
            <a href="/documentation">Documentation</a>
        </nav>
        <div class="app-header__actions">
            <div class="app-header__menu">
                <button type="button" class="app-header__power-btn" id="power-menu-btn" aria-haspopup="true" aria-expanded="false" aria-label="App power" data-tooltip="App power"><svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#circle-power"></use></svg></button>
                <div class="app-header__dropdown" id="power-dropdown" role="menu" hidden>
                    <button id="restart-btn" type="button" class="app-header__dropdown-item app-header__dropdown-item--restart" role="menuitem">Restart app</button>
                    <button id="stop-btn" type="button" class="app-header__dropdown-item app-header__dropdown-item--stop" role="menuitem">Stop app</button>
                </div>
            </div>
        </div>
    </header>
{{ content }}
    <footer class="app-footer" id="app-footer">
        <span>Magic-data</span>
        <a href="https://github.com/md2it/magic-data" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://github.com/md2it/magic-data/issues" target="_blank" rel="noopener noreferrer">Report issue</a>
    </footer>
    <script src="/assets/js/shared/icons.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script src="/assets/js/shared/tooltip.js"></script>
{{ page_scripts }}
</body>
</html>
